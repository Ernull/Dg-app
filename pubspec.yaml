name: digijeet
description: Jetjon Luxury Client for Digikala
publish_to: 'none'
version: 2.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.8.0
  url_launcher: ^6.2.6
  webview_flutter_android: ^3.15.0
  http: ^1.2.0
  path_provider: ^2.1.4
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"

flutter:
  uses-material-design: true

