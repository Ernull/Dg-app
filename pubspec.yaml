name: digijeet
description: A secure client for Digikala Jet login.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # استفاده از پکیج‌های جدید و بروز
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.15.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

# تنظیمات ساخت خودکار آیکون
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png" # دقت کنید فایل icon.png در روت پروژه باشد

flutter:
  uses-material-design: true
